<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>阿嬤看板</title>
<style>
  :root { --bg: #1b1712; --fg: #fff8ec; --muted: #e6d8bf; --accent: #f3b562; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease; }
  .slide.on { opacity: 1; }
  .slide img { position: relative; width: 100%; height: 100%; object-fit: contain; }
  .slide { overflow: hidden; isolation: isolate; }
  .slide .blur { position: absolute; inset: -40px; background-size: cover; background-position: center;
    filter: blur(40px) brightness(.45); z-index: -1; }
  #caption { position: fixed; left: 0; right: 0; bottom: 0; padding: 4vh 5vw 5vh;
    background: linear-gradient(transparent, rgba(0,0,0,.85) 35%); }
  #who { font-size: clamp(40px, 8vw, 110px); font-weight: 800; line-height: 1.1; }
  #who b { color: var(--accent); }
  #when { font-size: clamp(26px, 4vw, 56px); color: var(--muted); margin-top: 1vh; }
  #clock { position: fixed; top: 3vh; right: 4vw; text-align: right; text-shadow: 0 2px 12px #000; }
  #clock .t { font-size: clamp(40px, 7vw, 96px); font-weight: 700; }
  #clock .d { font-size: clamp(22px, 3vw, 40px); color: var(--muted); }
  #empty { position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    font-size: clamp(32px, 6vw, 72px); line-height: 1.5; padding: 5vw; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="caption"><div id="who"></div><div id="when"></div></div>
<div id="clock"><div class="t"></div><div class="d"></div></div>
<div id="empty">孫仔猶未傳相片來<br>等一下就有矣</div>
<script>
(() => {
  const key = new URLSearchParams(location.search).get("key") || "";
  const q = "key=" + encodeURIComponent(key);
  const stage = document.getElementById("stage");
  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  let slides = [], idx = -1, timer = null;

  function md(iso) { const [y, m, d] = iso.split("-").map(Number); return `${m} 月 ${d} 日`; }
  function ago(iso) {
    const days = Math.round((Date.now() - new Date(iso + "T12:00:00")) / 864e5);
    if (days <= 0) return "今仔日"; if (days === 1) return "昨昏"; if (days < 7) return `${days} 工前`;
    if (days < 14) return "頂禮拜"; return md(iso);
  }
  function tick() {
    const n = new Date();
    document.querySelector("#clock .t").textContent = n.toLocaleTimeString("zh-TW", { hour: "numeric", minute: "2-digit" });
    document.querySelector("#clock .d").textContent = `${n.getMonth() + 1} 月 ${n.getDate()} 日 禮拜${WEEK[n.getDay()]}`;
  }
  async function load() {
    try {
      const r = await fetch("/trips?n=12&" + q);
      if (!r.ok) throw new Error(r.status);
      const trips = await r.json();
      const next = [];
      for (const t of trips) {
        const photos = t.photos.slice(0, 8);
        for (const p of photos) next.push({ src: "/media/" + p.split("/").map(encodeURIComponent).join("/") + "?" + q, t });
      }
      slides = next;
      document.getElementById("empty").style.display = slides.length ? "none" : "grid";
      if (!timer && slides.length) { show(); timer = setInterval(show, 12000); }
    } catch (e) { console.warn("load", e); }
  }
  function show() {
    if (!slides.length) return;
    idx = (idx + 1) % slides.length;
    const s = slides[idx];
    const div = document.createElement("div");
    div.className = "slide";
    div.innerHTML = `<div class="blur"></div><img alt="">`;
    div.querySelector(".blur").style.backgroundImage = `url("${s.src}")`;
    const img = div.querySelector("img");
    img.onload = () => {
      stage.appendChild(div);
      requestAnimationFrame(() => div.classList.add("on"));
      [...stage.children].slice(0, -2).forEach(el => el.remove());
      const where = s.t.places.slice(0, 2).join("、") || "外口";
      document.getElementById("who").innerHTML = `${s.t.who || "孫仔"} 去 <b>${where}</b>`;
      document.getElementById("when").textContent = ago(s.t.start) + (s.t.start !== s.t.end ? `，耍 ${Math.round((new Date(s.t.end) - new Date(s.t.start)) / 864e5) + 1} 工` : "");
    };
    img.onerror = () => setTimeout(show, 500);
    img.src = s.src;
  }
  // 避免平板睡著
  async function wake() { try { await navigator.wakeLock?.request("screen"); } catch (_) {} }
  document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && wake());
  tick(); setInterval(tick, 20000); wake(); load(); setInterval(load, 600000);
})();
</script>
</body>
</html>
