[project]
name = "tshulai-engine"
version = "0.1.0"
description = "厝內 Persona Engine：scene 狀態機、對話腦、記憶、生活模擬器、plugin host"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
  "jsonschema>=4.22",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
drive = ["google-api-python-client>=2.150", "google-auth>=2.35", "requests>=2.32"]
plugins = ["mcp>=2.3"]
memory = ["sqlite-vec>=0.1.9", "fastembed>=0.5"]
voice = ["faster-whisper>=1.1", "audioseal>=0.2", "torchaudio>=2.4"]
vision = ["torch>=2.4", "torchvision>=0.19", "transformers>=4.45", "timm>=1.0", "kornia>=0.7", "einops>=0.8", "c2pa-python>=0.10", "cryptography>=43"]
dev = ["pytest>=8", "httpx2>=0.1", "lunar_python>=1.4", "pyyaml>=6", "sqlite-vec>=0.1.9"]

[project.scripts]
tshulai-engine = "tshulai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tshulai"]

[tool.hatch.build.targets.wheel.force-include]
"tshulai/web" = "tshulai/web"
