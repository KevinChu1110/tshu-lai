[project]
name = "tshulai-engine"
version = "0.1.0"
description = "厝內 Persona Engine：scene 狀態機、對話腦、記憶、生活模擬器、plugin host"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8", "httpx2>=0.1"]

[project.scripts]
tshulai-engine = "tshulai.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tshulai"]
