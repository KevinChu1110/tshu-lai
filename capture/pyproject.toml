[project]
name = "tshulai-capture"
version = "0.1.0"
description = "厝內 階段 0：家人語音與影像的採集整理工具"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
tshulai-capture = "tshulai_capture.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tshulai_capture"]
