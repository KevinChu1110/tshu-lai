# 台語訪談題庫。一次問一個主題，每題問完讓她講到自然停下來。
# purpose 說明這題蒐集到的東西會用在哪裡。
# 社群可以加主題，但請保留「每個人都問的三題」結構。

topics:
  - id: grandpa
    name: 阿公
    note: 先問，這是她最會主動講的主題
    questions:
      - q: 你佮阿公是按怎熟似的？
        purpose: 她最常講的故事，也是主動開口的首選話題
      - q: 阿公少年的時陣是啥物款的人？
      - q: 恁結婚彼工，你會記得啥物？
      - q: 阿公上愛食啥？上愛做啥？
      - q: 阿公有啥物歹習慣，予你氣甲欲死的？
        purpose: 她講阿公的語氣，疼愛和抱怨混在一起的那種
      - q: 阿公若是閣佇咧，你上想欲佮伊做啥？

  - id: childhood
    name: 她的童年
    questions:
      - q: 你細漢蹛佗位？厝是啥物款？
        purpose: 年代記憶，她講「以前」時的材料
      - q: 你細漢的時陣上愛𨑨迌啥？
      - q: 你有讀冊無？學校是啥物款？
      - q: 恁老爸老母是做啥物頭路的？
      - q: 你細漢的時陣，過年是按怎過的？
        purpose: 節日觸發時她會講的話
      - q: 彼陣上辛苦的是啥物代誌？

  - id: marriage
    name: 嫁來這個家
    questions:
      - q: 你幾歲嫁來的？彼陣心情按怎？
      - q: 大家官對你按怎？
      - q: 你第一擺做老母是啥物心情？
      - q: 阿爸細漢的時是啥款囡仔？
        purpose: 她講你爸媽的方式，人物關係表用

  - id: relative
    name: 每一個親戚
    note: 一次一個人，每個人都問這三題。{name} 換成她對那個人的稱呼。
    questions:
      - q: 講一下 {name} 這个人，你對伊的印象是啥？
        purpose: 她怎麼稱呼這個人，是人物關係表最重要的欄位
      - q: 伊細漢的時陣有啥物好笑的代誌？
      - q: 你上掛心伊啥物？
        purpose: 聊到這個人時她會提的事

  - id: neighbors
    name: 厝邊
    questions:
      - q: 恁厝邊頭尾有啥人？佗一个佮你上好？
      - q: 恁遮最近有發生啥物代誌？
        purpose: 讓她講別人八卦的語氣
      - q: 你去菜市仔攏去佗一攤？頭家是啥款人？
      - q: 廟裡的事、廟會、拜拜，你按怎弄？

  - id: to_you
    name: 她對你的話
    note: 她願意的時候再問
    questions:
      - q: 你對{user}細漢的印象是啥？
      - q: 你希望伊以後變做啥物款的人？
      - q: 若伊工作足忝，你會想欲共伊講啥？
        purpose: 你說工作累時她的回應
      - q: 若伊心情無好，你會按怎安慰伊？
      - q: 若伊欲結婚、欲生囡仔，你會想欲講啥？
        purpose: 可以直接變成「給未來的留言」

  - id: daily
    name: 日常與喜好
    note: 輕鬆，累的時候問這些
    questions:
      - q: 你一工攏按怎過？幾點起床？幾點食飯？
        purpose: 作息表，生活模擬器用
      - q: 你愛看啥物節目？佗一个演員你上愛？
        purpose: 看電視情境用
      - q: 你上愛食啥？上無愛食啥？
      - q: 你愛聽啥物歌？
      - q: 天氣熱的時陣你會講啥？落雨的時陣咧？
        purpose: 天氣話題的口頭禪
      - q: 手機你上會用的是啥？上常卡住的是啥？
        purpose: 「滑手機遇到問題」情境用
