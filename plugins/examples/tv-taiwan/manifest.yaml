name: tv-taiwan
version: 0.1.0
description: 台灣電視節目表與八點檔劇情摘要，讓她會問劇情、罵壞人
kind: [knowledge, trigger]
languages: [nan-TW, zh-TW]
server:
  command: uvx
  args: [tshulai-plugin-tv-taiwan]
provides:
  triggers:
    - event: tv.program_started
      description: 她常看的節目開始了
  tools:
    - get_tonight_drama_summary
    - get_schedule
  topics:
    - 八點檔劇情
    - 鄉土劇演員
permissions: [network]
